services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prototype
      POSTGRES_PASSWORD: prototype
      POSTGRES_DB: prototype_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d prototype_hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://prototype:prototype@postgres:5432/prototype_hub?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-prototype-assets}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-local-development-preview-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      PREVIEW_ORIGIN: http://preview.localhost:8080
      COOKIE_SECURE: "false"
    command: sh -c "pnpm --filter @prototype-hub/db prisma:migrate && pnpm --filter @prototype-hub/api start"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgresql://prototype:prototype@postgres:5432/prototype_hub?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-prototype-assets}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-session-secret}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-local-development-preview-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      MAX_FILES: ${MAX_FILES:-5000}
      EXTRACTED_MAX_BYTES: ${EXTRACTED_MAX_BYTES:-524288000}
    command: pnpm --filter @prototype-hub/worker start
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
    command: pnpm --filter @prototype-hub/web start
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_started }
      api: { condition: service_healthy }

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
